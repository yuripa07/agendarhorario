services:
  postgres:
    image: postgres:17.6-alpine
    container_name: agendarhorario-postgres-dev
    environment:
      POSTGRES_USER: agendarhorario
      POSTGRES_PASSWORD: agendarhorario
      POSTGRES_DB: agendarhorario
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendarhorario -d agendarhorario"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
