name: E2E

on:
  pull_request:
    branches: [main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: agendarhorario
          POSTGRES_PASSWORD: agendarhorario
          POSTGRES_DB: agendarhorario
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agendarhorario -d agendarhorario"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://agendarhorario:agendarhorario@localhost:5432/agendarhorario
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agendarhorario/api test:e2e
      - run: pnpm --filter @agendarhorario/web exec playwright install --with-deps chromium
      - run: pnpm --filter @agendarhorario/web test:e2e
