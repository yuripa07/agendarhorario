name: Deploy Homelab

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/api:latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:latest
      - name: Notify homelab
        if: ${{ secrets.HOMELAB_DEPLOY_WEBHOOK_URL != '' }}
        run: |
          curl --fail --request POST \
            --header "Authorization: Bearer ${{ secrets.HOMELAB_DEPLOY_WEBHOOK_TOKEN }}" \
            "${{ secrets.HOMELAB_DEPLOY_WEBHOOK_URL }}"
