name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: agendarhorario
          POSTGRES_PASSWORD: agendarhorario
          POSTGRES_DB: agendarhorario
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agendarhorario -d agendarhorario"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://agendarhorario:agendarhorario@localhost:5432/agendarhorario
      WEB_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
